# Two-lap windward/leeward, and the triple-sausage variant with a gate.
#
# This file exists to demonstrate two things the Manly Cove course does not:
#
#   1. ONE LINE, THREE STEPS. The leeward line is the start, mark 2, and the finish.
#      It appears three times in the sequence and needs no special treatment, because
#      roles are positional and the letters are derived. Read it in course order and
#      its senses are forward, reverse, reverse — which is exactly the three triangles
#      drawn on it in wiki/course-2lap-wl.svg.
#
#   2. A GATE. A step may offer alternatives instead of naming one line, and a boat
#      satisfies it by satisfying any one of them. The alternatives are ordinary
#      steps, so a gate does not require both sides to be the same kind of thing —
#      when real marks arrive, a gate with a virtual line one side and a buoy the
#      other is just a list with one of each in it.
#
#   3. A HANDICAP BY DISTANCE. The `handicap` course's windward step names a track rather
#      than a line to cross, and gives each boat's own line a width. Every boat's line is
#      placed along the track by its TCF, so the fleet starts and finishes together and
#      the first boat home wins on handicap.
#
# The positions here were placed on a chart in the editor for demonstration; none is a
# survey.

name: Windward/leeward (shape demonstration)
datum: WGS84

points:

lines:
  leeward:
    name: Leeward line
    port:      {latitude: -33.823123, longitude: 151.272613}
    starboard: {latitude: -33.823105, longitude: 151.274699}
    notes: >
      Start, mark 2 and finish. One line, three crossings.
  windward:
    name: Windward line
    port:      {latitude: -33.817158, longitude: 151.272728}
    starboard: {latitude: -33.817140, longitude: 151.274632}
  gate-left:
    name: Windward gate, left
    port:      {latitude: -33.822602, longitude: 151.272865, infinite: true}
    starboard: {latitude: -33.821793, longitude: 151.272855}
  gate-right:
    name: Windward gate, right
    port:      {latitude: -33.821766, longitude: 151.274488}
    starboard: {latitude: -33.822593, longitude: 151.274509, infinite: true}
  windward-track:
    name: Windward handicap track
    port:      {latitude: -33.816300, longitude: 151.273680}
    starboard: {latitude: -33.818000, longitude: 151.273680}
    notes: >
      Runs up the course axis from below the windward line to above it. Not crossed
      itself: a handicapped step places each boat's own line along it by its TCF.

courses:
  windward-leeward:
    name: "Windward leeward course "
    notes: >
      The base case. wiki/course-2lap-wl.svg draws it.
    variants:
      two-laps:
        name: Two laps
        template: true
        sequence:
          - {line: leeward, cross: forward}
          - {line: windward, cross: forward}
          - {line: leeward, cross: reverse}
          - {line: windward, cross: forward}
          - {line: leeward, cross: reverse}
      one-lap:
        name: One lap
        template: true
        sequence:
          - {line: leeward, cross: forward}
          - {line: windward, cross: forward}
          - {line: leeward, cross: reverse}
      three-laps:
        name: Three laps
        template: true
        sequence:
          - {line: leeward, cross: forward}
          - {line: windward, cross: forward}
          - {line: leeward, cross: reverse}
          - {line: windward, cross: forward}
          - {line: leeward, cross: reverse}
          - {line: windward, cross: forward}
          - {line: leeward, cross: forward}
  downwind-gate:
    name: Downwind gate
    notes: >
      As above, but the windward mark is a gate and the boat picks a side. The leg into a
      gate is measured to the midpoint between its alternatives, so the course length does
      not depend on which side a given boat took — a length that varied per boat would make
      the live-place axis mean different things for different boats.
    variants:
      3-laps:
        name: 3 Laps
        template: true
        sequence:
          - {line: leeward, cross: forward}
          - {line: windward, cross: forward}
          - gate:
                - {line: gate-left, cross: forward}
                - {line: gate-right, cross: forward}
            notes: >
              Either side.
          - {line: windward, cross: forward}
          - gate:
                - {line: gate-left, cross: forward}
                - {line: gate-right, cross: forward}
          - {line: windward, cross: forward}
          - {line: leeward, cross: reverse}
      2-laps:
        name: 2 Laps
        template: true
        sequence:
          - {line: leeward, cross: forward}
          - {line: windward, cross: forward}
          - gate:
                - {line: gate-left, cross: forward}
                - {line: gate-right, cross: forward}
            notes: >
              Either side.
          - {line: windward, cross: forward}
          - {line: leeward, cross: reverse}
      1-lap:
        name: 1 Lap
        template: true
        sequence:
          - {line: leeward, cross: forward}
          - {line: windward, cross: forward}
          - {line: leeward, cross: reverse}
  handicap:
    name: Handicapped by distance
    notes: >
      One lap round a windward mark handicapped by distance, 3. in the header's terms:
      every boat starts and finishes together, and each rounds its own line, placed up the
      windward track by its TCF, so the first boat home wins on handicap.
    variants:
      one-lap:
        name: One lap
        sequence:
          - {line: leeward, cross: forward}
          - {line: windward-track, cross: forward, handicapWidthM: 80}
          - {line: leeward, cross: reverse}

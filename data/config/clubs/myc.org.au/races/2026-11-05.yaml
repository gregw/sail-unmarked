# One race: a course from the programme, the format it is raced under, that format's
# parameters, and the boats in it.
#
# ---------------------------------------------------------------------------------
# THIS SHAPE IS TBD. It loads and round-trips, and that is all it is claiming. What
# each format actually needs is an open question — see CLAUDE.md. `parameters` is a
# free map on purpose, so a format's settings can be written down and carried before
# anybody has decided what to call them.
# ---------------------------------------------------------------------------------
#
# Separate from the programme file deliberately: the programme holds what is reusable
# all season (the surveyed points, the lines, the courses), and a race is one night.
# Filing them together would mean opening the file with the coordinates in it every
# time somebody enters a boat.

series: 2026-example
name: Thursday twilight, 5 November
course: manly-cove-circuit
format: rollingStart

# The window a boat may start its own clock in. Its clock starts when it crosses the
# start line, timestamped on the device — there is no gun and no committee-boat
# sightline, which is the whole point of the format.
windowOpen:  2026-11-05T07:00:00Z    # 18:00 Sydney
windowClose: 2026-11-05T07:30:00Z    # 18:30 Sydney

parameters: {}

entrants:
  - {boatId: aus1234, boatName: Bombora,   sailNumber: AUS1234, tcf: 1.021}
  - {boatId: aus5678, boatName: Currawong, sailNumber: AUS5678, tcf: 0.964}

notes: >
  TCFs are illustrative. Where a handicap comes from is open — the brief suggests
  reusing the sailing-pf read side, which is not wired up.

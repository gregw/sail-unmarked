# unmarked server configuration.
#
# Small on purpose. Everything about the racing — points, lines, courses, and the
# detection tuning — lives in the club/series programme files under clubs/, because
# that is what a club owns and what changes. What is left here is the listener, and the one
# thing about a BOAT'S screen that is a property of the fleet rather than of the water.

site:
  name: "Unmarked Racing"
  contact: "unmarked@mortbay.org"

# How the BOATS draw, as opposed to how this server runs.
display:
  # THE CLOSEST THE APPROACH PLOT WILL EVER ZOOM, in the joining boat's own lengths of line
  # across the view. The join screen asks each boat for its length, because three lengths of a
  # ten-metre keel boat and three of a five-metre dinghy are different amounts of water — and
  # what a sailor wants to know at a start line is how much room there is in BOATS.
  #
  # Raise it to keep more line in view on a long start line, lower it to close in harder on the
  # last few metres. Below one the boat would not fit in its own picture, so one is the floor.
  boatLengthsAcross: 4

server:
  # 8081, 8082 and 8888 are taken by the other sailing services that share this host.
  port: 8083

  # Reconstruct the externally-visible URL from X-Forwarded-* headers. Set true when
  # something else terminates the connection — the proxy in front of
  # https://unmarked.mortbay.org — and false when this server is reached directly.
  # Never turn it on for a directly-exposed server: those headers are whatever the
  # client sent.
  forwardedHeaders: false

  # One line per request in the ordinary log — on the Pi, `journalctl -u sail-unmarked`.
  # On by default. The clients here are phones on marginal connections, so "did the
  # record actually arrive" is the question that will be asked, and this is what
  # answers it.
  requestLog: true

  # The course editor saves as you type, so this is on by default or the editor simply
  # does not work. It is the second lock behind the login: with it on and no auth.yaml,
  # ANYTHING THAT CAN REACH THIS PORT CAN REWRITE THE COURSE FILES. Correct for a laptop
  # on a desk; configure auth.yaml (see auth.yaml.example), or set this false, before the
  # server is reachable from anywhere else. It warns at startup.
  configWrites: true

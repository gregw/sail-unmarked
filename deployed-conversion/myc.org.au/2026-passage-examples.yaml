    port:      {latitude: -33.801743, longitude: 151.279912}
    starboard: {latitude: -33.802515, longitude: 151.280827}

# ---------------------------------------------------------------------------------
# Courses. A sequence of steps; THE FIRST STEP IS THE START AND THE LAST IS THE
# FINISH, so there are no roles to write down and nothing that can disagree with the
# order. The letters drawn on a course diagram (S, 1, 2, … F) are derived from
# position for the same reason.
#
# A leg is measured between the midpoints of consecutive lines' two defined points.
# `lengthNm` on a step overrides the leg INTO that step, for a length that is a matter
# of record rather than of geometry.
# ---------------------------------------------------------------------------------
courses:
  harbour-cycle:
    name: Sydney Harbour Cycle
    public: true
    variants:
      all-boats-circuit:
        name: All boats circuit
        closed: true
        sequence:
          - {line: reef-beach, cross: forward, entry: true}
          - {line: manly-cove, cross: forward}
          - {line: bombora, cross: reverse}
          - {line: middle-head, cross: reverse}
          - {line: steel-point, cross: forward}
          - {line: shark-south, cross: reverse, entry: true}
          - {line: bradleys, cross: forward}
          - {line: kirribilli, cross: forward, entry: true}
          - {line: bradleys, cross: reverse, entry: true}
          - {line: steel-point, cross: reverse}
          - {line: vaucluse, cross: forward, entry: true}
          - {line: middle-head, cross: forward}
          - {line: hunters, cross: reverse}
          - {line: grotto-point, cross: forward, entry: true}
          - {line: bombora, cross: forward}
  distance-offshore:
    name: Distance Corrected Offshore
    public: true
    variants:
      div-all:
        name: All Divisions
        sequence:
          - {line: sowpigs-east, cross: forward}
          - {line: hornby, cross: forward}
          - {line: north-head, cross: reverse}
          - {line: long-reef, cross: forward}
          - {line: bondi, cross: forward}
          - {line: hornby, cross: reverse}
          - {line: sowpigs-east, cross: reverse}
  distance-inshore:
    name: Distance Corrected Inshore
    public: true
    variants:
      div-all-ne:
        name: All Division NE
        sequence:
          - {line: reef-beach, cross: forward}
          - {line: manly-cove, cross: forward}
          - {line: bombora, cross: reverse}
          - {line: grotto, cross: forward}
          - {line: middle-head, cross: reverse}
          - {line: sowpigs-east, cross: reverse}
          - {line: port-jackson, cross: forward}
          - {line: sowpigs-east, cross: forward}
          - {line: middle-head, cross: forward}
          - {line: grotto, cross: forward}
          - {line: bombora, cross: forward}
          - {line: reef-beach, cross: forward}

races:
  20260919-race-1:
    name: Race 1
    date: 2026-09-19

# Manly Cove passage courses — the worked course from the brief, section 07, and a harbour
# circuit.
#
# One file per club and series. The path is the identity: this file is filed under
# clubs/myc.org.au/ and named 2026-passage-examples, so its club is "myc.org.au" and its
# series is "2026-passage-examples". Nothing here is resolved from any other file.
#
# ---------------------------------------------------------------------------------
# NOTHING IN THIS FILE IS A SURVEY. The positions below were placed by eye on a chart
# in the editor, to have something to sail in the test rig. Real positions are to be
# surveyed, not guessed, before anybody races these courses — a point left null loads,
# and is reported as a problem by name rather than pretended.
# ---------------------------------------------------------------------------------

name: Example passage courses
datum: WGS84

notes: >
  The example course from the project brief, in the originator's words: an east-west
  start and finish line in Manly Cove, a line going infinitely due east from Sow and
  Pigs reef, a line going infinitely south from Shark Island, a 100 m line in Obelisk
  Bay parallel to the coast, a line going infinitely south from Sow and Pigs, then
  finish. The required crossing senses below are INFERRED from the course order, not
  stated by the originator, and must be confirmed before anybody races this.

# Detection tuning for this series. Every number is a default set against data that
# does not exist yet — they are configuration so they can be tuned against real logged
# tracks from these waters rather than argued about.
defaults:
  confirmFixes: 3          # N in the 3-and-3 rule
  accuracyBandM: null      # how far over one far-side fix must be, or null for half its stated accuracy
  qc:
    minSatellites: 4       # receiver-metadata pre-filter: necessary, not sufficient
    maxAccuracyM: 25
    maxSpeedKn: 40         # the kinematic gate — the primary defence against flyers

# ---------------------------------------------------------------------------------
# Points. Placed once, referred to by id, so a correction is one edit. Sow and Pigs
# is shared by two lines, which is exactly why this section exists.
# ---------------------------------------------------------------------------------
points:
  sow-and-pigs:
    name: Sow and Pigs reef
    latitude: -33.836894
    longitude: 151.270799
    notes: >
      Shared fixed end of both Sow and Pigs lines.
  shark-island:
    name: Shark Island
    latitude: -33.858848
    longitude: 151.258084
  bombora:
    latitude: -33.814463
    longitude: 151.273347
  middle-head:
    name: middle head
    latitude: -33.825377
    longitude: 151.267497
  steel-point:
    name: Steel Point
    latitude: -33.851518
    longitude: 151.264877

# ---------------------------------------------------------------------------------
# Lines. Two ends, named port and starboard: a FORWARD crossing leaves the port end to
# port and the starboard end to starboard, and a REVERSE crossing does the opposite.
# The names are relative to a forward crossing, so a line crossed both ways — the
# Manly Cove line, which is both the start and the finish — is forward once and
# reverse once.
#
# An end with `infinite: true` is a BEARING, NOT A PLACE: the line runs out through
# that point and keeps going, so the point says which way the line goes and not where
# it stops. That is why the rule needs no exception at infinity — an infinite end is
# always on the side its name says, and only a finite end can be missed.
#
# Lines are defined here rather than inside a course because they are reused: the same
# start line appears in every course a club sails.
# ---------------------------------------------------------------------------------
lines:
  reef-beach:
    name: Reef Beach
    port:      {latitude: -33.804312, longitude: 151.276820}
    starboard: {latitude: -33.805875, longitude: 151.278183}
    notes: >
      Runs 090/270 between two shore points, spanning the cove. Crossed southbound to start
      and northbound to finish. Both ends on shore, so there is no near-end crossing to
      dispute.
  sowpigs-east:
    name: Sow and Pigs, east
    port:      {at: sow-and-pigs}
    starboard: {latitude: -33.836974, longitude: 151.276293, infinite: true}
    notes: >
      Half-infinite, running 090 from the reef. Required crossing southbound.
  shark-south:
    name: Shark Island, south
    port:      {at: shark-island}
    starboard: {latitude: -33.862693, longitude: 151.258346, infinite: true}
    notes: >
      Half-infinite, running 180 from the island; shore-limited in practice, which is why it
      can be infinite without being crossable at the far end. Crossed westbound.
  sowpigs-south:
    name: Sow and Pigs, south
    port:      {at: sow-and-pigs}
    starboard: {latitude: -33.838520, longitude: 151.270777, infinite: true}
    notes: >
      Half-infinite, running 180 from the same reef as sowpigs-east. The two lines share
      their finite end, which is why sow-and-pigs is a named point.
  shark-west:
    name: Shark west
    port:      {latitude: -33.858660, longitude: 151.253058, infinite: true}
    starboard: {at: shark-island}
  vaucluse:
    port:      {latitude: -33.844799, longitude: 151.272004}
    starboard: {latitude: -33.845571, longitude: 151.274483}
  grotto-point:
    name: Grotto Point
    port:      {latitude: -33.817652, longitude: 151.262347}
    starboard: {latitude: -33.824389, longitude: 151.264440}
  bombora:
    name: Bombora passing
    port:      {at: bombora}
    starboard: {latitude: -33.816223, longitude: 151.275927, infinite: true}
  middle-head:
    name: Middle Head passing
    port:      {at: middle-head}
    starboard: {latitude: -33.822718, longitude: 151.273117, infinite: true}
  steel-point:
    name: Steel Point
    port:      {at: steel-point}
    starboard: {latitude: -33.848437, longitude: 151.256330, infinite: true}
  hunters:
    name: Hunters Bay
    port:      {latitude: -33.826060, longitude: 151.257093}
    starboard: {latitude: -33.818730, longitude: 151.253400}
  kirribilli:
    port:      {latitude: -33.850018, longitude: 151.222919}
    starboard: {latitude: -33.850997, longitude: 151.226032}
  bradleys:
    name: Bradleys Head
    port:      {latitude: -33.860447, longitude: 151.246687, infinite: true}
    starboard: {latitude: -33.852982, longitude: 151.246597}
  eastern:
    name: Eastern Channel
    port:      {latitude: -33.841969, longitude: 151.276521, infinite: true}
    starboard: {latitude: -33.841807, longitude: 151.271808}
  western:
    name: Western Channel
    port:      {latitude: -33.839077, longitude: 151.260474, infinite: true}
    starboard: {latitude: -33.840487, longitude: 151.264298}
  north-head:
    name: North Head
    port:      {latitude: -33.830462, longitude: 151.306251, infinite: true}
    starboard: {latitude: -33.823248, longitude: 151.299684}
  long-reef:
    name: Long Reef Variable
    port:      {latitude: -33.707124, longitude: 151.347956}

  macquarie:
    name: Macquarie Light
    port:      {latitude: -33.850791, longitude: 151.304040, infinite: true}
    starboard: {latitude: -33.853962, longitude: 151.285228}
  hornby:
    name: Hornby Light
    port:      {latitude: -33.826779, longitude: 151.281194, infinite: true}

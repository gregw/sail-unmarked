<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype client &middot; Unmarked Racing</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="device.css">
<style>
/*
 * Two panels, and the split between them is the point of the page.
 *
 * LEFT is the test rig: a chart, a boat that goes where it is told, and the knobs that
 * decide what its receiver reports. RIGHT is the client, which is the thing that would
 * ship. Nothing crosses between them but a fix, so the rig can be as elaborate as it
 * likes without any of it leaking into the boat.
 */
body { padding: 0; height: 100vh; overflow: hidden; }

/*
 * THE RIG IS THE PAGE, and the phone floats over it.
 *
 * It was a two-column grid, which made the device a panel of the page — and a panel is not what
 * is being prototyped. What ships is a phone in a bracket, and a phone sits ON the chart the
 * way it sits on a cockpit bulkhead: over the water, in the way of some of it, movable when it
 * is in the way of the wrong part. Giving the rig the whole window also gives it back the
 * quarter of the screen it was paying for a column that is now a floating object.
 */
.split {
  display: grid;
  /*
   * ONE DEFINITE ROW, and that is what keeps the rig honest. An implicit `auto` row is sized
   * by its tallest content, so anything inside that wants to be taller than the window grows
   * the row instead of being clamped by it — and `height: 100%` on a child then resolves
   * against the grown row, which is circular and lets content win. The chart is an SVG, and
   * an SVG with a viewBox has an intrinsic ratio it will happily impose at a width this wide.
   * A row of exactly 100% gives the rig a definite height to stretch to and to shrink inside.
   */
  grid-template-rows: 100%;
  height: 100vh;
}

/*
 * THE PHONE: a case round the screen, and the case is the handle.
 *
 * <b>Dragged by the case and never by the screen</b>, which is the whole reason there is a case
 * at all rather than a border. The screen's own chart pans on a drag, and a phone that moved
 * when you dragged the chart — or a chart that stayed put when you dragged the phone — would be
 * two gestures fighting over one pointer. A bezel wide enough to take hold of settles it in the
 * way the real object does: you pick a phone up by its edges.
 *
 * Floating rather than docked, because a prototype you cannot move is a prototype that is
 * permanently over the part of the chart you need. It starts out of the way, top right.
 */
.phone {
  position: fixed;
  /* Clear of the rig's own bar, which is the one strip of the page that must never be under
     it: those are the controls for the chart the phone is sitting on. */
  top: 58px;
  right: 24px;
  z-index: 10;
  background: #05090d;
  border-radius: 40px;
  padding: 30px 11px 22px;
  box-shadow: 0 20px 55px rgba(0, 0, 0, 0.6), 0 0 0 1px #223444, inset 0 0 0 1px #0d151d;
  cursor: grab;
  touch-action: none;
  user-select: none;
}
.phone.dragging { cursor: grabbing; box-shadow: 0 26px 70px rgba(0, 0, 0, 0.7), 0 0 0 1px var(--line); }

/* The earpiece and lens: what makes the case read as a phone rather than as a rounded box. */
.phone .case { position: absolute; top: 0; left: 0; right: 0; height: 30px; }
.phone .speaker {
  position: absolute; top: 13px; left: 50%; transform: translateX(-50%);
  width: 52px; height: 5px; border-radius: 3px; background: #16222e;
}
.phone .camera {
  position: absolute; top: 12px; left: calc(50% + 40px);
  width: 7px; height: 7px; border-radius: 50%; background: #16222e;
  box-shadow: inset 0 0 0 1px #223444;
}
/* The home indicator, which is also the bottom edge of the grab area. */
.phone .home {
  position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%);
  width: 96px; height: 4px; border-radius: 2px; background: #1b2a37;
}

/*
 * The SCREEN is not draggable and says so: the cursor over it belongs to whatever is under the
 * pointer — the chart's own, a button's — and never to the case.
 */
.phone .device { cursor: default; border-radius: 6px; }

/* ------------------------------------------------------------------ the rig */

/*
 * FULL HEIGHT, ALWAYS. The rig is the chart the boat is sailed on and the knobs that lie to it,
 * and every pixel of it is worth having — it is the desk, not the device. Constraining the
 * DEVICE's height must never reach it: `align-items: start` on the split did, which left the
 * rig at its content height and the chart, being a flex child free to shrink, collapsed to a
 * thin strip. So the constraint lives on `.device` alone, as `align-self`, and the rig takes
 * the whole of the definite row by stretching into it — the default, and now the row is
 * definite it means something.
 *
 * `min-height: 0` so the chart can shrink inside it rather than pushing it open, and
 * `overflow: hidden` as the backstop for the same thing.
 */
.rig {
  display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
  border-right: 1px solid var(--panel2);
}

.rigbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--panel2);
}
.rigbar .sp { flex: 1; }
.rigbar h1 { font-size: 17px; }

/* A tickbox in the bar, lettered like the labels under it rather than like body text. */
.rigbar .tick {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted); cursor: pointer; user-select: none;
}
.rigbar .tick input { accent-color: var(--line); cursor: pointer; margin: 0; }
/* Lit while it is doing something, because a rig with the course hidden looks like a rig
   with no course loaded, and the difference matters. */
.rigbar .tick:has(:checked) { color: var(--ok); }

/*
 * No system cursor: the chart draws its own, which is far more visible on dark water and can
 * say what the click will do. The grab cursor stays for the drag, where there is no reticle
 * because nothing is being aimed at.
 */
#rig { flex: 1; min-height: 0; width: 100%; display: block; background: var(--sea); cursor: none; }
#rig.dragging { cursor: grabbing; }

.knobs {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 4px 18px;
  padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--panel2);
}
.knob { display: flex; align-items: center; gap: 8px; }
.knob label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted); width: 74px; flex: none;
}
.knob input[type=range] { flex: 1; min-width: 60px; accent-color: var(--line); }
.knob .v { font-family: var(--mono); font-size: 12px; width: 62px; text-align: right; flex: none; }

/* -------------------------------------------------------------- the client */

/*
 * Deliberately narrow and its own scrolling surface: this is a phone in a bracket on a
 * tiller, not a desktop window, and a prototype shown wider than the thing it prototypes
 * flatters itself about how much will fit.
 *
 * <b>AND PHONE-SHAPED, not merely phone-wide.</b> It was 400px against the full window height,
 * which on a desktop monitor is 1:2.5 and on a tall one worse — a panel that shape has room
 * for things a phone has not, so anything laid out until it "fits" fits nothing. 9:19.5 is an
 * iPhone from the X onwards and near enough every Android flagship; 20:9 and 19:9 are within a
 * few percent of it, so one ratio stands in for all of them.
 *
 * Written once, as the `aspect-ratio`. The height is what is capped — by the window, or by
 * what 400px of width implies — and the width follows from the ratio, so the two can never
 * disagree. On a short window the panel narrows instead of being cropped, which is why every
 * type size below is in `cqi`: it is a fraction of THIS panel, not of a number somebody once
 * measured against a 400px one.
 *
 * Everything else about this screen — its type, its rows, its colours — is in `device.css`,
 * which `boat.html` links as well. What is HERE is only where the screen sits.
 */
.device {
  --panel-w: 400px;
  aspect-ratio: 9 / 19.5;
  height: min(calc(100vh - 160px), calc(var(--panel-w) * 19.5 / 9));
  border-bottom: 1px solid var(--panel2);
}

/* ------------------------------------------------- the rig's own two controls */

select.basemap {
  background: var(--panel2); color: var(--ink); border: 1px solid var(--panel2);
  border-radius: 4px; padding: 4px 6px; font-size: 12px;
}

/*
 * THE FIXES ARE A FIXED FIVE LINES AND THEN A SCROLLBAR.
 *
 * It is an append-only log at up to five a second, so anything that grows with it eats the
 * page: unbounded, the knobs went off the bottom of the window and most of the rig became a
 * list of accepted fixes. Five lines is enough to see the last second or two of decisions,
 * which is what the log is read for while something is happening; the rest is scrollback, for
 * afterwards.
 *
 * <b>A fixed height, not a maximum.</b> A box that grew to five lines and stopped would still
 * push the sliders down the instant the first fix arrived, so the controls would move under the
 * hand that was about to use them. This way the rig's bottom bar never changes height.
 *
 * Said in `em` rather than in pixels, so it follows the type: `7.5em` is five lines at a
 * line-height of 1.5, and stays five lines if the font size changes. The rows carry no padding
 * of their own for the same reason — a row has to be exactly one line for the arithmetic to
 * mean anything.
 */
.knob.fixes { align-items: flex-start; }
.knob.fixes label { padding-top: 3px; }

.trail {
  font-family: var(--mono); font-size: 10.5px; line-height: 1.5;
  /* 7.5em is five lines at this line-height; the 6px is the box's own border and padding,
     which `box-sizing: border-box` would otherwise take out of the five. */
  height: calc(7.5em + 6px);
  overflow-y: auto;
  padding: 2px 6px;
  background: var(--sea);
  border: 1px solid var(--panel2);
  border-radius: 3px;
}
.trail div { color: var(--muted); white-space: nowrap; }
.trail div.bad { color: var(--warn); }

@media (max-width: 860px) {
  .device { --panel-w: 280px; }
  .phone { top: 52px; right: 12px; }
}
</style>
</head>
<body>

<div class="split">

  <div class="rig">
    <div class="rigbar">
      <span class="kicker">Test rig</span>
      <button class="plain" id="run">Start</button>
      <button class="plain" id="place">Place boat</button>
      <span class="sp"></span>
      <span class="mono" id="truth" style="font-size:11px; color:var(--muted)"></span>
      <!--
        HIDE COURSE puts the rig's chart back to what the water looks like: no lines, no end
        dots, no letters. It is beside the basemap selector because both decide what the chart
        SHOWS, where Start and Place boat decide what the boat does.
      -->
      <label class="tick" title="Draw no course on the rig's chart, so the only thing saying where the marks are is the device beside it">
        <input type="checkbox" id="hidecourse"> Hide course
      </label>
      <select class="basemap" id="basemap"></select>
      <a href="index.html" style="font-size:12px">&larr; home</a>
    </div>

    <svg id="rig" xmlns="http://www.w3.org/2000/svg"></svg>

    <div class="knobs">
      <div class="knob"><label for="speed">Speed</label>
        <input type="range" id="speed" min="0" max="20" step="0.5" value="6">
        <span class="v" id="speed_v">6.0 kn</span></div>
      <div class="knob"><label for="hz">Fix rate</label>
        <input type="range" id="hz" min="0.2" max="5" step="0.2" value="1">
        <span class="v" id="hz_v">1.0 Hz</span></div>
      <div class="knob"><label for="noise">GPS noise</label>
        <input type="range" id="noise" min="0" max="25" step="1" value="3">
        <span class="v" id="noise_v">3 m</span></div>
      <div class="knob"><label for="flyer">Flyers</label>
        <input type="range" id="flyer" min="0" max="20" step="1" value="0">
        <span class="v" id="flyer_v">0 %</span></div>
      <div class="knob fixes" style="grid-column:1/-1"><label>Fixes</label>
        <div class="trail" id="trail" style="flex:1"><span class="muted">Not started.</span></div></div>
    </div>
  </div>

  <!--
    THE PHONE. The screen is the `.device` inside it; everything round it is case, and the case
    is the handle — see the CSS.
  -->
  <div class="phone" id="phone">
    <div class="case">
      <span class="speaker"></span>
      <span class="camera"></span>
    </div>
    <div class="device" id="device"></div>
    <div class="home"></div>
  </div>

</div>

<script type="module" src="client.js"></script>

</body>
</html>
